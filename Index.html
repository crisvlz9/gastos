<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f13">
  <title>Registrar gasto</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    :root{
      --bg:#0e0f13; --card:#171922; --line:#232634;
      --text:#eceef4; --muted:#8a8f9e; --accent:#3ddc84; --accent-dim:#1f4a33;
      --danger:#ff5c5c; --warn:#f2b84b;
    }
    *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
    html,body{margin:0; height:100%;}
    body{
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      display:flex; flex-direction:column; min-height:100dvh; overflow:hidden;
      padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    /* Top bar: back + progress + estado + ajustes */
    .top{ display:flex; align-items:center; gap:14px; padding:16px 18px 4px; height:52px; }
    .back, .gear{
      width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
      background:var(--card); color:var(--text); font-size:20px; line-height:1;
      display:flex; align-items:center; justify-content:center; cursor:pointer;
      transition:opacity .2s; flex:none;
    }
    .back{ opacity:0; pointer-events:none; }
    .back.on{ opacity:1; pointer-events:auto; }
    .gear{ font-size:16px; color:var(--muted); }
    .gear.off{ opacity:0; pointer-events:none; }
    .dots{ display:flex; gap:7px; flex:1; }
    .dot{ width:7px; height:7px; border-radius:50%; background:var(--line); transition:background .2s, width .2s; }
    .dot.active{ background:var(--accent); width:20px; border-radius:4px; }
    .pend{
      font-size:12px; color:var(--warn); border:1px solid #4a3a17; background:#231c0c;
      border-radius:10px; padding:4px 9px; display:none; white-space:nowrap;
    }
    .pend.on{ display:block; }

    main{ position:relative; flex:1; }
    .step{
      position:absolute; inset:0; display:flex; flex-direction:column;
      padding:8px 22px 24px;
      opacity:0; transform:translateX(60px); pointer-events:none;
      transition:transform .28s cubic-bezier(.4,0,.2,1), opacity .2s ease;
    }
    .step.active{ opacity:1; transform:none; pointer-events:auto; }
    .step.prev{ opacity:0; transform:translateX(-60px); }
    .step.nextp{ opacity:0; transform:translateX(60px); }

    .q{ font-size:22px; font-weight:600; letter-spacing:.2px; margin:14px 2px 0; }
    .q-sub{ font-size:13px; color:var(--muted); margin:6px 2px 0; }
    .mid{ flex:1; display:flex; flex-direction:column; justify-content:center; }

    /* Monto */
    #amount{
      width:100%; border:0; background:transparent; color:var(--text);
      text-align:center; font-size:60px; font-weight:700; letter-spacing:-1px;
      font-variant-numeric:tabular-nums; outline:none;
    }
    #amount::placeholder{ color:#3a3e4d; }

    /* Texto */
    input.text{
      width:100%; background:transparent; border:0; border-bottom:2px solid var(--line);
      padding:14px 4px; color:var(--text); font-size:24px; outline:none; text-align:center;
    }
    input.text:focus{ border-color:var(--accent); }
    input.text::placeholder{ color:var(--muted); font-size:20px; }

    /* Opciones (medio / categoría) */
    .opts{ display:flex; flex-direction:column; gap:10px; }
    .opts.grid{ flex-direction:row; flex-wrap:wrap; }
    .opt{
      border:1px solid var(--line); background:var(--card); color:var(--text);
      border-radius:14px; padding:17px 18px; font-size:17px; text-align:left; cursor:pointer;
      transition:transform .05s ease, background .12s, border-color .12s;
    }
    .opts.grid .opt{ flex:1 1 calc(50% - 5px); text-align:center; }
    .opt:active{ transform:scale(.97); }
    .opt.sel{ background:var(--accent-dim); border-color:var(--accent); color:#d8ffe8; font-weight:600; }

    /* Fecha */
    .datebox{ display:flex; flex-direction:column; gap:12px; align-items:center; }
    .datepill{
      position:relative; font-size:20px; background:var(--card); border:1px solid var(--line);
      border-radius:14px; padding:16px 26px; min-width:220px; text-align:center;
    }
    .datepill.sel{ border-color:var(--accent); color:#d8ffe8; }
    .datepill input{ position:absolute; inset:0; opacity:0; width:100%; height:100%; border:0; }

    /* Acción */
    .action{ padding-top:16px; }
    button.primary{
      width:100%; border:0; border-radius:16px; padding:18px; font-size:17px; font-weight:700;
      background:var(--accent); color:#06210f; cursor:pointer;
      transition:transform .05s ease, opacity .2s ease;
    }
    button.primary:active{ transform:scale(.98); }
    button.primary:disabled{ opacity:.4; }

    /* Done overlay */
    .done{
      position:absolute; inset:0; background:var(--bg); z-index:20;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
      opacity:0; pointer-events:none; transition:opacity .2s;
    }
    .done.show{ opacity:1; pointer-events:auto; }
    .check{
      width:80px; height:80px; border-radius:50%; background:var(--accent-dim);
      border:2px solid var(--accent); color:var(--accent); font-size:40px;
      display:flex; align-items:center; justify-content:center;
    }
    .done .lbl{ font-size:20px; font-weight:600; }
    .done .amt{ color:var(--muted); font-size:15px; }

    /* Configuración (primera vez) */
    .setup{
      position:fixed; inset:0; z-index:30; background:var(--bg);
      display:none; flex-direction:column; padding:calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 24px);
    }
    .setup.show{ display:flex; }
    .setup label{ font-size:13px; color:var(--muted); margin:22px 2px 6px; display:block; }
    .setup input{
      width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px;
      padding:14px; color:var(--text); font-size:15px; outline:none;
    }
    .setup input:focus{ border-color:var(--accent); }
    .setup .msg{ font-size:14px; margin-top:16px; min-height:20px; }
    .setup .msg.err{ color:var(--danger); }
    .setup .msg.ok{ color:var(--accent); }
    .setup .grow{ flex:1; }
    .setup .cancel{
      background:none; border:0; color:var(--muted); font-size:15px; padding:14px; width:100%; margin-top:6px;
    }


    /* Chip "por categorizar" */
    .porcat{
      font-size:12px; color:#d8ffe8; border:1px solid var(--accent); background:var(--accent-dim);
      border-radius:10px; padding:4px 9px; display:none; white-space:nowrap; cursor:pointer;
    }
    .porcat.on{ display:block; }

    /* Vista Pendientes */
    .pview{
      position:fixed; inset:0; z-index:25; background:var(--bg);
      display:none; flex-direction:column;
      padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    .pview.show{ display:flex; }
    .pview .phead{ display:flex; align-items:center; gap:14px; padding:16px 18px 8px; }
    .pview .phead .q{ margin:0; font-size:20px; }
    .plist{ flex:1; overflow-y:auto; padding:6px 16px 24px; display:flex; flex-direction:column; gap:10px; }
    .pmsg{ color:var(--muted); text-align:center; margin-top:40px; font-size:15px; }
    .item{ border:1px solid var(--line); background:var(--card); border-radius:14px; overflow:hidden; transition:opacity .2s; }
    .item.busy{ opacity:.4; pointer-events:none; }
    .item .ihead{ padding:14px 16px; cursor:pointer; }
    .item .r1{ display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
    .item .com{ font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .item .mto{ font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .item .meta{ font-size:13px; color:var(--muted); margin-top:4px; }
    .item .ibody{ display:none; padding:0 16px 16px; }
    .item.open{ border-color:var(--accent); }
    .item.open .ibody{ display:block; }
    .item .opts.grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
    .item .opts.grid .opt{ padding:13px 4px; font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; }
    .rec{ display:flex; align-items:center; gap:10px; margin:16px 2px 8px; font-size:14px; color:var(--muted); }
    .rec input{ width:18px; height:18px; accent-color:var(--accent); }
    .pat{
      width:100%; background:var(--bg); border:1px solid var(--line); border-radius:10px;
      padding:11px 12px; color:var(--text); font-size:15px; outline:none; text-transform:uppercase;
    }
    .pat:focus{ border-color:var(--accent); }
    .pat:disabled{ opacity:.4; }
    .discard{
      background:none; border:0; color:var(--danger); font-size:14px; padding:14px 0 0; cursor:pointer;
    }

    .shake{ animation:sh .3s; }
    @keyframes sh{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    @media (prefers-reduced-motion: reduce){ .step{ transition:none; } }
  </style>
</head>
<body>
  <div class="top">
    <button class="back" id="back" aria-label="Volver">‹</button>
    <div class="dots" id="dots"></div>
    <div class="pend" id="pend"></div>
    <button class="porcat" id="porcat"></button>
    <button class="gear" id="gear" aria-label="Ajustes">⚙</button>
  </div>

  <main>
    <!-- 1. MONTO -->
    <section class="step" data-focus="amount">
      <div class="q">¿Cuánto gastaste?</div>
      <div class="mid">
        <input id="amount" inputmode="numeric" placeholder="$0" autocomplete="off">
      </div>
      <div class="action"><button class="primary" data-next>Siguiente</button></div>
    </section>

    <!-- 2. DESCRIPCIÓN -->
    <section class="step" data-focus="desc">
      <div class="q">¿En qué gastaste?</div>
      <div class="mid">
        <input class="text" id="desc" placeholder="Ej: almuerzo, bencina…" autocomplete="off">
      </div>
      <div class="action"><button class="primary" data-next>Siguiente</button></div>
    </section>

    <!-- 3. MEDIO -->
    <section class="step">
      <div class="q">¿Con qué pagaste?</div>
      <div class="mid"><div class="opts" id="opts-medio"></div></div>
    </section>

    <!-- 4. CATEGORÍA -->
    <section class="step">
      <div class="q">¿Qué categoría?</div>
      <div class="mid"><div class="opts grid" id="opts-categoria"></div></div>
    </section>

    <!-- 5. FECHA + GUARDAR -->
    <section class="step">
      <div class="q">¿Cuándo fue?</div>
      <div class="mid">
        <div class="datebox">
          <div class="datepill sel" id="datepill">
            <span id="dateTxt">Hoy</span>
            <input type="date" id="fecha">
          </div>
          <div class="q-sub">Toca para elegir otra fecha</div>
        </div>
      </div>
      <div class="action"><button class="primary" id="save">Guardar gasto</button></div>
    </section>

    <!-- DONE -->
    <div class="done" id="done">
      <div class="check">✓</div>
      <div class="lbl">Guardado</div>
      <div class="amt" id="doneAmt"></div>
    </div>
  </main>


  <!-- PENDIENTES -->
  <div class="pview" id="pview">
    <div class="phead">
      <button class="back on" id="pback" aria-label="Volver">‹</button>
      <div class="q">Por categorizar</div>
    </div>
    <div class="plist" id="plist"></div>
  </div>

  <!-- CONFIGURACIÓN -->
  <div class="setup" id="setup">
    <div class="q">Conectar con tu planilla</div>
    <div class="q-sub">Se guarda solo en este teléfono. Lo haces una vez.</div>
    <label for="cfgUrl">URL de la implementación de Apps Script (termina en /exec)</label>
    <input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false" autocapitalize="off">
    <label for="cfgKey">Clave (la API_KEY de Codigo.gs)</label>
    <input id="cfgKey" type="password" autocomplete="off" spellcheck="false" autocapitalize="off">
    <div class="msg" id="cfgMsg"></div>
    <div class="grow"></div>
    <button class="primary" id="cfgSave">Conectar</button>
    <button class="cancel" id="cfgCancel">Cancelar</button>
  </div>

  <script>
    /* ---------- Almacenamiento local ---------- */
    var LS = {
      get: function(k, def){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } },
      set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
    };
    var DEFAULT_CFG = {
      medios: ['Efectivo','Débito','Crédito','Transferencia'],
      categorias: ['Comida','Supermercado','Transporte','Delivery','Compras','Cuentas','Salud','Entretención','Otros']
    };
    var conn  = LS.get('gastos_conn', null);   // {url, key}
    var cfg   = LS.get('gastos_cfg', DEFAULT_CFG);
    var cola  = LS.get('gastos_cola', []);     // gastos pendientes de enviar

    /* ---------- Referencias ---------- */
    var steps = Array.prototype.slice.call(document.querySelectorAll('.step'));
    var cur = 0;
    var data = { monto:'', descripcion:'', medio:'', categoria:'', fecha:'' };

    var backBtn = document.getElementById('back');
    var gearBtn = document.getElementById('gear');
    var pendEl  = document.getElementById('pend');
    var dotsBox = document.getElementById('dots');
    var amount  = document.getElementById('amount');
    var desc    = document.getElementById('desc');
    var fecha   = document.getElementById('fecha');
    var dateTxt = document.getElementById('dateTxt');
    var datepill= document.getElementById('datepill');
    var saveBtn = document.getElementById('save');
    var done    = document.getElementById('done');
    var doneAmt = document.getElementById('doneAmt');

    var setupEl = document.getElementById('setup');
    var cfgUrl  = document.getElementById('cfgUrl');
    var cfgKey  = document.getElementById('cfgKey');
    var cfgMsg  = document.getElementById('cfgMsg');
    var cfgSave = document.getElementById('cfgSave');
    var cfgCancel = document.getElementById('cfgCancel');

    /* ---------- Opciones dinámicas (vienen de Codigo.gs) ---------- */
    function renderOpts(){
      pintar('opts-medio', 'medio', cfg.medios);
      pintar('opts-categoria', 'categoria', cfg.categorias);
    }
    function pintar(boxId, grupo, lista){
      var box = document.getElementById(boxId);
      box.innerHTML = '';
      lista.forEach(function(v){
        var b = document.createElement('button');
        b.className = 'opt'; b.dataset.choice = grupo; b.dataset.value = v; b.textContent = v;
        b.addEventListener('click', function(){
          box.querySelectorAll('.opt').forEach(function(x){ x.classList.remove('sel'); });
          b.classList.add('sel');
          data[grupo] = v;
          setTimeout(next, 160);
        });
        box.appendChild(b);
      });
    }
    function cargarConfig(){
      if(!conn) return;
      fetch(conn.url + '?action=config&key=' + encodeURIComponent(conn.key))
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(j.ok && j.medios && j.categorias){
            var nuevo = { medios:j.medios, categorias:j.categorias };
            if(JSON.stringify(nuevo) !== JSON.stringify(cfg)){
              cfg = nuevo; LS.set('gastos_cfg', cfg);
              if(cur < 2) renderOpts(); // no re-pintar si estás eligiendo
            }
          }
        }).catch(function(){ /* sin red: se usan las opciones guardadas */ });
    }

    /* ---------- Cola de envío (funciona sin señal) ---------- */
    var enviando = false;
    function actualizarPend(){
      pendEl.textContent = cola.length === 1 ? '1 sin enviar' : cola.length + ' sin enviar';
      pendEl.classList.toggle('on', cola.length > 0);
    }
    function enviarCola(){
      if(enviando || !conn || cola.length === 0){ actualizarPend(); return; }
      enviando = true;
      var item = cola[0];
      fetch(conn.url, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' }, // text/plain evita el bloqueo CORS
        body: JSON.stringify(Object.assign({ key:conn.key, action:'gasto' }, item))
      })
      .then(function(r){ return r.json(); })
      .then(function(j){
        enviando = false;
        if(j.ok){
          cola.shift(); LS.set('gastos_cola', cola); actualizarPend();
          enviarCola();
        } else if(j.error === 'Clave incorrecta'){
          actualizarPend(); abrirSetup('La clave no coincide con la de Codigo.gs.');
        } else if(j.error === 'Monto inválido'){
          cola.shift(); LS.set('gastos_cola', cola); actualizarPend(); enviarCola();
        } else {
          actualizarPend(); // error del Sheet: se reintenta más tarde
        }
      })
      .catch(function(){ enviando = false; actualizarPend(); }); // sin red: se reintenta más tarde
    }
    window.addEventListener('online', enviarCola);
    document.addEventListener('visibilitychange', function(){ if(!document.hidden){ enviarCola(); cargarConfig(); cargarPendientes(); } });
    setInterval(function(){ if(cola.length) enviarCola(); }, 30000);

    function nuevoId(){
      if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    }

    /* ---------- Configuración ---------- */
    function abrirSetup(msg){
      cfgUrl.value = conn ? conn.url : '';
      cfgKey.value = conn ? conn.key : '';
      cfgMsg.textContent = msg || ''; cfgMsg.className = 'msg' + (msg ? ' err' : '');
      cfgCancel.style.display = conn ? 'block' : 'none';
      setupEl.classList.add('show');
    }
    cfgCancel.addEventListener('click', function(){ setupEl.classList.remove('show'); });
    cfgSave.addEventListener('click', function(){
      var url = cfgUrl.value.trim(), key = cfgKey.value.trim();
      if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){
        cfgMsg.textContent = 'La URL debe empezar con https://script.google.com/macros/s/ y terminar en /exec.';
        cfgMsg.className = 'msg err'; return;
      }
      if(!key){ cfgMsg.textContent = 'Falta la clave.'; cfgMsg.className = 'msg err'; return; }
      cfgSave.disabled = true; cfgSave.textContent = 'Probando conexión…'; cfgMsg.textContent = '';
      fetch(url + '?action=config&key=' + encodeURIComponent(key))
        .then(function(r){ return r.json(); })
        .then(function(j){
          cfgSave.disabled = false; cfgSave.textContent = 'Conectar';
          if(!j.ok){ cfgMsg.textContent = j.error || 'No se pudo conectar.'; cfgMsg.className = 'msg err'; return; }
          conn = { url:url, key:key }; LS.set('gastos_conn', conn);
          cfg = { medios:j.medios, categorias:j.categorias }; LS.set('gastos_cfg', cfg); renderOpts();
          cfgMsg.textContent = 'Conectado.'; cfgMsg.className = 'msg ok';
          setTimeout(function(){ setupEl.classList.remove('show'); go(0); enviarCola(); cargarPendientes(); }, 500);
        })
        .catch(function(){
          cfgSave.disabled = false; cfgSave.textContent = 'Conectar';
          cfgMsg.textContent = 'No hubo respuesta. Revisa que la implementación tenga acceso "Cualquier usuario".';
          cfgMsg.className = 'msg err';
        });
    });
    gearBtn.addEventListener('click', function(){ abrirSetup(); });


    /* ---------- Pendientes ---------- */
    var porcatBtn = document.getElementById('porcat');
    var pview = document.getElementById('pview');
    var plist = document.getElementById('plist');
    var pendientes = [];
    var abierto = null; // id del ítem expandido

    function fmtMonto(n){ return '$' + Number(n).toLocaleString('es-CL'); }
    function fmtFecha(iso){
      var m = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
      var p = String(iso).split('-');
      return p.length === 3 ? Number(p[2]) + ' ' + m[Number(p[1]) - 1] : iso;
    }
    function fmtOrigen(o){
      if(/santander/i.test(o)) return 'Santander';
      if(/bchile/i.test(o)) return 'Banco de Chile';
      return o || 'Manual';
    }

    function actualizarPorcat(){
      var n = pendientes.length;
      porcatBtn.textContent = n === 1 ? '1 por categorizar' : n + ' por categorizar';
      porcatBtn.classList.toggle('on', n > 0 && cur === 0);
    }

    function cargarPendientes(){
      if(!conn) return;
      fetch(conn.url + '?action=pendientes&key=' + encodeURIComponent(conn.key))
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(!j.ok) return;
          pendientes = j.items || [];
          actualizarPorcat();
          if(pview.classList.contains('show')) renderPendientes();
        })
        .catch(function(){
          if(pview.classList.contains('show') && !pendientes.length){
            plist.innerHTML = '<div class="pmsg">Sin conexión. Los pendientes se cargan cuando vuelva la señal.</div>';
          }
        });
    }

    function renderPendientes(){
      plist.innerHTML = '';
      if(!pendientes.length){
        plist.innerHTML = '<div class="pmsg">Todo categorizado.</div>';
        return;
      }
      pendientes.forEach(function(it){
        var el = document.createElement('div');
        el.className = 'item' + (abierto === it.id ? ' open' : '');

        var head = document.createElement('div');
        head.className = 'ihead';
        head.innerHTML = '<div class="r1"><span class="com"></span><span class="mto"></span></div><div class="meta"></div>';
        head.querySelector('.com').textContent = it.descripcion || 'Sin descripción';
        head.querySelector('.mto').textContent = fmtMonto(it.monto);
        head.querySelector('.meta').textContent = fmtFecha(it.fecha) + ' · ' + (it.medio || '') + ' · ' + fmtOrigen(it.origen);
        head.addEventListener('click', function(){
          abierto = (abierto === it.id) ? null : it.id;
          renderPendientes();
        });

        var body = document.createElement('div');
        body.className = 'ibody';
        var grid = document.createElement('div');
        grid.className = 'opts grid';
        cfg.categorias.forEach(function(c){
          var b = document.createElement('button');
          b.className = 'opt'; b.textContent = c;
          b.addEventListener('click', function(){ categorizar(it, c, el, chk.checked, pat.value); });
          grid.appendChild(b);
        });

        var rec = document.createElement('label');
        rec.className = 'rec';
        var chk = document.createElement('input'); chk.type = 'checkbox'; chk.checked = true;
        rec.appendChild(chk);
        rec.appendChild(document.createTextNode('Recordar para comercios que contengan:'));
        var pat = document.createElement('input');
        pat.className = 'pat'; pat.value = it.descripcion || ''; pat.spellcheck = false; pat.autocapitalize = 'characters';
        chk.addEventListener('change', function(){ pat.disabled = !chk.checked; });

        var del = document.createElement('button');
        del.className = 'discard';
        del.textContent = 'Descartar: duplicado o no es un gasto';
        del.addEventListener('click', function(){
          if(confirm('¿Borrar "' + (it.descripcion || '') + '" por ' + fmtMonto(it.monto) + ' del Sheet?')) descartar(it, el);
        });

        body.appendChild(grid); body.appendChild(rec); body.appendChild(pat); body.appendChild(del);
        el.appendChild(head); el.appendChild(body);
        plist.appendChild(el);
      });
    }

    function postAccion(payload){
      return fetch(conn.url, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ key:conn.key }, payload))
      }).then(function(r){ return r.json(); });
    }

    function categorizar(it, cat, el, recordar, patron){
      el.classList.add('busy');
      postAccion({ action:'categorizar', id:it.id, categoria:cat, recordar:recordar, patron:patron })
        .then(function(j){
          if(!j.ok){ el.classList.remove('busy'); alert('No se pudo guardar: ' + j.error); return; }
          abierto = null;
          // quitarlo al tiro; si la regla categorizó otros, la recarga los saca también
          pendientes = pendientes.filter(function(x){ return x.id !== it.id; });
          renderPendientes(); actualizarPorcat();
          if(j.aplicadas) cargarPendientes();
        })
        .catch(function(){ el.classList.remove('busy'); alert('Sin conexión. Intenta de nuevo.'); });
    }

    function descartar(it, el){
      el.classList.add('busy');
      postAccion({ action:'descartar', id:it.id })
        .then(function(j){
          if(!j.ok){ el.classList.remove('busy'); alert('No se pudo borrar: ' + j.error); return; }
          abierto = null;
          pendientes = pendientes.filter(function(x){ return x.id !== it.id; });
          renderPendientes(); actualizarPorcat();
        })
        .catch(function(){ el.classList.remove('busy'); alert('Sin conexión. Intenta de nuevo.'); });
    }

    porcatBtn.addEventListener('click', function(){
      abierto = pendientes.length ? pendientes[0].id : null;
      renderPendientes(); pview.classList.add('show'); cargarPendientes();
    });
    document.getElementById('pback').addEventListener('click', function(){ pview.classList.remove('show'); go(0); });

    /* ---------- Wizard (igual que antes) ---------- */
    steps.forEach(function(){ var d=document.createElement('div'); d.className='dot'; dotsBox.appendChild(d); });
    var dots = Array.prototype.slice.call(dotsBox.children);

    function isoHoy(){ var t=new Date(); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
    fecha.value = isoHoy(); data.fecha = fecha.value;
    fecha.addEventListener('change', function(){
      data.fecha = fecha.value;
      dateTxt.textContent = fecha.value === isoHoy() ? 'Hoy' : fecha.value.split('-').reverse().join('/');
      datepill.classList.add('sel');
    });

    amount.addEventListener('input', function(){
      data.monto = amount.value.replace(/\D/g,'');
      amount.value = data.monto ? '$' + Number(data.monto).toLocaleString('es-CL') : '';
    });
    amount.addEventListener('keydown', function(e){ if(e.key==='Enter') next(); });
    desc.addEventListener('keydown', function(e){ if(e.key==='Enter') next(); });

    document.querySelectorAll('[data-next]').forEach(function(b){ b.addEventListener('click', next); });
    backBtn.addEventListener('click', function(){ if(cur>0) go(cur-1); });
    saveBtn.addEventListener('click', guardar);

    function render(){
      steps.forEach(function(el, i){
        el.classList.remove('active','prev','nextp');
        el.classList.add(i===cur ? 'active' : (i<cur ? 'prev' : 'nextp'));
      });
      dots.forEach(function(d,i){ d.classList.toggle('active', i===cur); });
      backBtn.classList.toggle('on', cur>0);
      gearBtn.classList.toggle('off', cur>0);
      if(typeof actualizarPorcat === 'function') actualizarPorcat();
      var f = steps[cur].dataset.focus;
      if(f && !setupEl.classList.contains('show')){ setTimeout(function(){ document.getElementById(f).focus(); }, 300); }
    }
    function go(i){ cur = i; render(); }

    function next(){
      if(cur===0 && !data.monto){
        amount.parentElement.classList.add('shake');
        setTimeout(function(){ amount.parentElement.classList.remove('shake'); }, 300);
        return;
      }
      if(cur < steps.length-1) go(cur+1);
    }

    // Guarda al instante en el teléfono y envía en segundo plano.
    function guardar(){
      if(!data.monto){ go(0); return; }
      data.descripcion = desc.value.trim();
      cola.push({
        id: nuevoId(), monto: data.monto, descripcion: data.descripcion,
        medio: data.medio, categoria: data.categoria, fecha: data.fecha
      });
      LS.set('gastos_cola', cola);
      actualizarPend();
      enviarCola();

      doneAmt.textContent = '$' + Number(data.monto).toLocaleString('es-CL') +
        (data.categoria ? ' · ' + data.categoria : '');
      done.classList.add('show');
      setTimeout(reset, 1100);
    }

    function reset(){
      done.classList.remove('show');
      data = { monto:'', descripcion:'', medio:'', categoria:'', fecha:isoHoy() };
      amount.value=''; desc.value=''; fecha.value=isoHoy(); dateTxt.textContent='Hoy';
      document.querySelectorAll('.opt').forEach(function(b){ b.classList.remove('sel'); });
      go(0);
    }

    /* ---------- Inicio ---------- */
    renderOpts();
    render();
    actualizarPend();
    if(!conn){ abrirSetup(); } else { cargarConfig(); enviarCola(); cargarPendientes(); }

    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  </script>
</body>
</html>
